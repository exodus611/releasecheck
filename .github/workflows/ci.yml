name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Build the demo folders
        run: python3 demo/make_fixtures.py
      - name: The good folder must pass
        run: python3 releasecheck.py check demo/_build/good
      - name: The broken folder must fail
        run: "! python3 releasecheck.py check demo/_build/broken"
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 demo/make_fixtures.py
      - name: Run this repository's own action
        uses: ./
        with:
          folder: demo/_build/good
